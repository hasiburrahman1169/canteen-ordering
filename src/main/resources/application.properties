spring.application.name=canteen-ordering
spring.datasource.url=jdbc:h2:file:./data/canteen
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.thymeleaf.cache=false
server.port=8080
canteen.admin.username=${CANTEEN_ADMIN_USERNAME:admin}
canteen.admin.password=${CANTEEN_ADMIN_PASSWORD:change-me-now}

# Real payment gateway credentials must be supplied through environment variables.
# Do not commit merchant secrets to this file.
payment.bkash.base-url=${BKASH_BASE_URL:}
payment.bkash.app-key=${BKASH_APP_KEY:}
payment.bkash.app-secret=${BKASH_APP_SECRET:}
payment.bkash.username=${BKASH_USERNAME:}
payment.bkash.password=${BKASH_PASSWORD:}
payment.nagad.base-url=${NAGAD_BASE_URL:}
payment.nagad.merchant-id=${NAGAD_MERCHANT_ID:}
payment.nagad.public-key=${NAGAD_PUBLIC_KEY:}
