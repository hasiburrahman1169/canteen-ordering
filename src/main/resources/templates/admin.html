<!DOCTYPE html><html lang="bn" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin</title><link rel="stylesheet" href="/style.css"></head><body><header><strong>🍽 CanteenGo Admin</strong><span><a href="/">Customer view</a> · <form class="inline" method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="link-button">Logout</button></form></span></header><main>
<div class="stats"><div><small>আজকের বিক্রি</small><strong th:text="${'৳' + todaySales}"></strong></div><div><small>মোট অর্ডার</small><strong th:text="${orders.size()}"></strong></div><div><small>মেনু আইটেম</small><strong th:text="${menuItems.size()}"></strong></div></div>
<section class="panel"><h2>অর্ডার ম্যানেজমেন্ট</h2><table><thead><tr><th>Order</th><th>Customer</th><th>Pickup</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead><tbody><tr th:each="order : ${orders}"><td th:text="${'#' + order.id}"></td><td th:text="${order.customerName + ' (' + order.phone + ')'}"></td><td th:text="${order.pickupTime}"></td><td th:text="${'৳' + order.total}"></td><td th:text="${order.paymentMethod + ' / ' + order.paymentStatus + (order.paymentReference != null ? ' / ' + order.paymentReference : '')}"></td><td><form class="inline" method="post" th:action="${'/admin/order/' + order.id + '/status'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select name="status" onchange="this.form.submit()"><option th:each="s : ${T(com.canteen.ordering.order.OrderStatus).values()}" th:value="${s}" th:text="${s}" th:selected="${s == order.status}"></option></select></form></td></tr></tbody></table></section>
<section class="panel"><h2>নতুন মেনু আইটেম</h2><form action="/admin/menu" method="post" class="form-grid"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>নাম<input name="name" required></label><label>দাম<input name="price" type="number" min="0" step=".01" required></label><label>Stock<input name="stock" type="number" min="0" required></label><label>ছবির URL<input name="imageUrl"></label><label class="wide">বর্ণনা<input name="description"></label><button>মেনুতে যোগ করুন</button></form></section>
<section class="panel"><h2>মেনু</h2><div th:each="item : ${menuItems}" class="row menu-row"><span th:text="${item.name + ' — ৳' + item.price + ' (stock: ' + item.stock + ')'}"></span><form method="post" th:action="${'/admin/menu/' + item.id + '/availability'}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="secondary" th:text="${item.isAvailable() ? 'বন্ধ করুন' : 'চালু করুন'}"></button></form></div></section>
</main></body></html>
