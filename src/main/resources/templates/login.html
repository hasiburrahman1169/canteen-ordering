<!DOCTYPE html><html lang="bn" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="/style.css"></head><body><main class="narrow"><section class="panel login"><h1>Admin Login</h1><p>ক্যান্টিন ম্যানেজমেন্ট প্যানেলে প্রবেশ করুন</p><form method="post" action="/login"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Username<input name="username" required autofocus></label><label>Password<input type="password" name="password" required></label><button>Login</button><p class="error" th:if="${param.error}">Username অথবা password ভুল।</p></form></section></main></body></html>
