<!DOCTYPE html><html lang="bn" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Order confirmed</title><link rel="stylesheet" href="/style.css"></head><body>
<header><strong>🍽 CanteenGo</strong><a href="/">নতুন অর্ডার</a></header><main class="narrow">
<section class="success"><div class="check">✓</div><p class="eyebrow">অর্ডার গ্রহণ করা হয়েছে</p><h1 th:text="${'Order #' + order.id}"></h1><p th:text="${order.customerName + ', আপনার pickup time: ' + order.pickupTime}"></p></section>
<section class="panel"><h2>অর্ডারের অবস্থা</h2><p th:text="${'Payment: ' + order.paymentMethod + ' — ' + order.paymentStatus}"></p><p th:if="${order.paymentReference}" th:text="${'Transaction ID: ' + order.paymentReference}"></p><div class="status-track"><span class="active">Pending</span><span th:classappend="${order.status.name() == 'PREPARING' or order.status.name() == 'READY' or order.status.name() == 'COMPLETED' ? 'active' : ''}">Preparing</span><span th:classappend="${order.status.name() == 'READY' or order.status.name() == 'COMPLETED' ? 'active' : ''}">Ready</span></div><div th:each="line : ${order.lines}" class="row"><span th:text="${line.itemName + ' × ' + line.quantity}"></span><b th:text="${'৳' + line.subtotal}"></b></div><hr><div class="row"><strong>Total</strong><strong th:text="${'৳' + order.total}"></strong></div></section></main></body></html>
