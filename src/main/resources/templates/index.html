<!DOCTYPE html>
<html lang="bn" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CanteenGo</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div><strong>🍽 CanteenGo</strong><span> ক্যাম্পাস খাবার, লাইনের ঝামেলা ছাড়া</span></div><a href="/admin">Admin Panel</a></header>
<main>
  <section class="hero"><p class="eyebrow">আজকের মেনু</p><h1>পছন্দের খাবার আগে থেকেই অর্ডার করুন</h1><p>অর্ডার করুন, pickup time বেছে নিন, আর Ready হলে নিয়ে যান।</p></section>
  <p class="error" th:if="${error}" th:text="${error}"></p>
  <form action="/order" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <section class="menu-grid">
      <article class="food-card" th:each="item : ${menuItems}">
        <img th:src="${item.imageUrl}" th:alt="${item.name}">
        <div class="food-body"><div class="row"><h3 th:text="${item.name}"></h3><b th:text="${'৳' + item.price}"></b></div>
          <p th:text="${item.description}"></p><small th:text="${item.isAvailable() ? 'Available: ' + item.stock : 'Unavailable'}"></small>
          <input class="quantity" type="number" min="0" th:max="${item.stock}" value="0" th:name="${'quantity_' + item.id}" th:disabled="${!item.isAvailable()}">
        </div>
      </article>
    </section>
    <section class="checkout">
      <h2>অর্ডার তথ্য</h2><div class="form-grid">
        <label>নাম<input required name="customerName" placeholder="আপনার নাম"></label>
        <label>ফোন<input required name="phone" placeholder="01XXXXXXXXX"></label>
        <label>Pickup time<input required type="datetime-local" name="pickupTime"></label>
        <label>Payment<select id="paymentMethod" name="paymentMethod" onchange="togglePaymentReference()"><option value="CASH_ON_PICKUP">Cash on pickup</option><option value="BKASH">bKash</option><option value="NAGAD">Nagad</option></select></label>
        <label id="paymentReferenceField" hidden>Transaction ID<input name="paymentReference" placeholder="bKash/Nagad TrxID"></label>
      </div><button type="submit">অর্ডার করুন →</button>
    </section>
  </form>
</main>
<script>function togglePaymentReference(){const method=document.getElementById('paymentMethod').value;const field=document.getElementById('paymentReferenceField');field.hidden=method==='CASH_ON_PICKUP';field.querySelector('input').required=method!=='CASH_ON_PICKUP';}togglePaymentReference();</script>
</body></html>
